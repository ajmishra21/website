<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #lock-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    #welcome-screen {
      display: none;
      font-size: 15px;
      font-weight: 400;
      color: #111;
      letter-spacing: 0.04em;
    }
    input[type="password"] {
      border: none;
      border-bottom: 1px solid #ccc;
      outline: none;
      font-size: 14px;
      text-align: center;
      letter-spacing: 0.2em;
      padding: 6px 0;
      width: 120px;
      color: #111;
      background: transparent;
      transition: border-color 0.2s;
    }
    input[type="password"]:focus { border-bottom-color: #888; }
    input[type="password"].error { border-bottom-color: #e24b4a; }
    .error-msg {
      font-size: 11px;
      color: #e24b4a;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <div id="lock-screen">
    <input type="password" id="passcode" placeholder="passcode" autocomplete="off" />
    <span class="error-msg" id="error-msg"></span>
  </div>
  <div id="welcome-screen">Welcome</div>

  <script>
   
    const CORRECT_HASH = '780d083cd289e1afdb64bac37c0929ff960bb762c29629240e46985557d27d3e';

    async function hashPassword(input) {
      const encoded = new TextEncoder().encode(input);
      const buffer = await crypto.subtle.digest('SHA-256', encoded);
      return Array.from(new Uint8Array(buffer))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
    }

    document.getElementById('passcode').addEventListener('keydown', async function(e) {
      this.classList.remove('error');
      document.getElementById('error-msg').textContent = '';

      if (e.key === 'Enter') {
        const hash = await hashPassword(this.value);
        if (hash === CORRECT_HASH) {
          document.getElementById('lock-screen').style.display = 'none';
          document.getElementById('welcome-screen').style.display = 'block';
        } else {
          this.classList.add('error');
          document.getElementById('error-msg').textContent = 'incorrect';
          this.value = '';
        }
      }
    });
  </script>
</body>
</html>
